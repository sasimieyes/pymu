<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2b6cb0" />
  <title>PDF 변환기 · PyMuPDF + PaddleOCR</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
</head>
<body>
  <header>
    <h1>PDF 변환기</h1>
    <p class="sub">이미지·PDF를 하나의 PDF로 병합하고, 필요하면 OCR 텍스트 레이어를 추가합니다.</p>
  </header>

  <main>
    <!-- ─── 변환/병합 탭 ──────────────────────────── -->
    <section id="tab-convert">
      <div id="dropzone" class="dropzone">
        <p>여기로 파일을 끌어다 놓거나 클릭해서 선택하세요</p>
        <p class="hint">지원: PDF · 이미지(JPG/PNG/BMP/TIFF/WEBP/GIF) · 오피스(DOCX/XLSX/PPTX) · 한글(HWP/HWPX)</p>
        <input id="file-input" type="file" multiple
               accept=".pdf,.jpg,.jpeg,.png,.bmp,.tif,.tiff,.webp,.gif,.doc,.docx,.hwp,.hwpx,.odt,.rtf,.xls,.xlsx,.ods,.csv,.ppt,.pptx,.odp,.txt,.html,.htm"
               hidden />
      </div>

      <ul id="file-list" class="file-list"></ul>

      <div class="options">
        <label class="checkbox">
          <input type="checkbox" id="ocr-toggle" checked />
          <span class="checkbox-label">
            <strong>OCR</strong>
            <span class="checkbox-hint">- 이미지 또는 이미지PDF 에 텍스트 레이어를 입힙니다.</span>
          </span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="llm-toggle" checked />
          <span class="checkbox-label">
            <strong>AI 오탈자보정</strong>
            <span class="checkbox-hint">- OCR 중 추출된 텍스트의 오탈자를 AI로 교정합니다. (주의 - 변환시간이 크게 늘어납니다)</span>
          </span>
        </label>
        <button id="convert-btn" class="primary" disabled>PDF로 변환</button>
      </div>
    </section>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    // Auto-resize: report body height to the parent (the blog) so the iframe
    // grows/shrinks with the content. No-op when not embedded.
    (function () {
      if (window.parent === window) return;
      var PARENT_ORIGIN = "https://infra-oldman.tistory.com";
      function postHeight() {
        var h = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight
        );
        window.parent.postMessage(
          { type: "pymu:resize", height: h },
          PARENT_ORIGIN
        );
      }
      try { new ResizeObserver(postHeight).observe(document.body); } catch (_) {}
      window.addEventListener("load", postHeight);
      postHeight();
    })();
  </script>
</body>
</html>
